[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrag"
dynamic = ["version"]
description = "Embedding-free RAG. An LLM compiles your documents once; every query stays pure BM25."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NineNatthanarong" }]
keywords = [
    "rag", "bm25", "retrieval", "search", "tantivy", "llm", "local",
    "embedding-free", "sparse-retrieval", "information-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core stays featherweight: a fast persistent engine, a pure-Python stemmer, and an
# HTTP client so the local-LLM path works on the core install alone. No models, ever.
dependencies = [
    "tantivy>=0.24",
    "snowballstemmer>=2.2",
    "httpx>=0.24",
]

[project.optional-dependencies]
openai = ["openai>=1.0", "tiktoken>=0.5"]                 # SDK retries + exact token counts
bm25s = ["bm25s>=0.2", "numpy>=1.23", "scipy>=1.10"]      # optional in-memory fast-batch engine
pdf = ["pypdf>=4.0"]
tiktoken = ["tiktoken>=0.5"]
eval = [
    "ranx>=0.3",
    "pytrec_eval-terrier>=0.5",
    "beir>=2.0",
    "ragas>=0.2",
    "datasets>=2.0",
]
dev = [
    "nrag[openai,bm25s,eval]",
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
nrag = "nrag.cli:main"

[project.urls]
Homepage = "https://github.com/NineNatthanarong/NRAG"
Repository = "https://github.com/NineNatthanarong/NRAG"
Issues = "https://github.com/NineNatthanarong/NRAG/issues"

[tool.hatch.version]
path = "nrag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nrag"]

# Keep the source distribution lean: ship the package, license, and readme only.
[tool.hatch.build.targets.sdist]
include = ["/nrag", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
markers = [
    "eval: end-to-end evaluation tests (may require network / extra deps)",
    "live_llm: tests that require a running local LLM server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative baseline focused on real bugs; ratchet stricter over time.
select = ["E", "F", "W", "I", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # dataclass-style default args (FieldWeights()) are intentional here
    "SIM105",  # contextlib.suppress rewrites not always clearer
    "RUF012",  # ClassVar annotations — not enforcing yet
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM"]
